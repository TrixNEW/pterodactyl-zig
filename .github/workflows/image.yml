name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/trixnew/pterodactyl-zig
  ZIG_VERSION: 0.17.0

jobs:
  build:
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: pterodactyl-zig:test
          build-args: |
            ZIG_VERSION=${{ env.ZIG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
      - run: bash tests/smoke.sh pterodactyl-zig:test "$ZIG_VERSION"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ZIG_VERSION=${{ env.ZIG_VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Save image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Publish multi-platform tags
        env:
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          refs=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            refs+=("${IMAGE}@sha256:${digest##*/}")
          done
          test "${#refs[@]}" = 2
          docker buildx imagetools create \
            --tag "${IMAGE}:${ZIG_VERSION}" \
            --tag "${IMAGE}:${SHA_TAG}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" | tee "${RUNNER_TEMP}/manifest.txt"
          digest=$(awk '/^Digest:/ { print $2; exit }' "${RUNNER_TEMP}/manifest.txt")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published %s:%s\n\nPull by digest: %s@%s\n' \
            "$IMAGE" "$ZIG_VERSION" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
